# Production configuration. Supply every required secret; TLS terminates at your ingress.
x-api-environment: &api-environment
  APP_ENV: production
  DEBUG: 'false'
  DATABASE_URL: postgresql+asyncpg://intelliclaim:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/intelliclaim
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  ML_API_KEY: ${ML_API_KEY:?Set ML_API_KEY}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
  S3_BUCKET: intelliclaim-images
  ML_SERVICE_URL: http://ml-service:8001
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intelliclaim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: intelliclaim
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U intelliclaim']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes: [redis_data:/data]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes: [minio_data:/data]
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: alembic -c backend/alembic.ini upgrade head
    environment: *api-environment
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *api-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  ml-service:
    build: {context: ., dockerfile: ml/Dockerfile}
    environment:
      APP_ENV: production
      ML_API_KEY: ${ML_API_KEY:?Set ML_API_KEY}
    volumes: [./ml/weights:/app/ml/weights:ro]
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    environment: *api-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped
  dispatcher:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: python -m app.worker.dispatcher
    environment: *api-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped
  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile}
    ports: ['127.0.0.1:8080:80']
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  minio_data:
