services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use scripts/dev.py start --full-stack to generate credentials}
      POSTGRES_DB: intelliclaim
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intelliclaim"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Missing Neo4j password}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1" >/dev/null
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 30

  minio:
    build:
      context: ./containers/minio
      dockerfile: Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-intelliclaim}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Missing MinIO password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:9000/minio/health/ready
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend_environment
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/intelliclaim
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Missing signing secret}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_USER:-intelliclaim}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_BUCKET: intelliclaim-images
      ML_SERVICE_URL: http://ml-service:8001
      STORAGE_BACKEND: s3
      UPLOADS_DIR: /app/uploads
      PROCESSING_MODE: celery
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_DATABASE: neo4j
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      DEBUG: "false"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      ml-service: {condition: service_healthy}
    volumes: [uploads_data:/app/uploads]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 20
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports: ["127.0.0.1:8001:8001"]
    volumes:
      - ./ml/weights:/app/ml/weights:ro
      - image_history_data:/app/ml/evidence
    environment:
      IMAGE_HISTORY_PATH: /app/ml/evidence/image_history.sqlite3
      YOLO_CONFIG_DIR: /tmp/yolo
      MPLCONFIGDIR: /tmp/matplotlib
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8001/health',timeout=5)); assert d['model_trained'] and d['components']['tabular_classifier']['available'] and d['components']['graph_baseline']['available']"]
      interval: 15s
      timeout: 8s
      start_period: 90s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    environment: *backend_environment
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  minio_data:
  uploads_data:
  image_history_data:
