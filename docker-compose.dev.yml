# Explicit local infrastructure; credentials are development-only, ports are loopback-bound.
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: intelliclaim}
    ports: ['127.0.0.1:55432:5432']
    volumes: [dev_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    volumes: [dev_minio:/data]
volumes:
  dev_postgres:
  dev_minio:
